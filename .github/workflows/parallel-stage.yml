name: Parallel Builds

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Run tests
      uses: docker/build-push-action@v5
      with:
        context: .
        target: test
        push: false
  
  build-dev:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build dev image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: development
        push: false
  
  build-prod:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build production
      uses: docker/build-push-action@v5
      with:
        context: .
        target: production
        push: false